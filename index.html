<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="خدمات الإعلام الآلي القاعدية للمكاتب والمدارس - صيانة، شبكات، دعم تقني" />
  <title>TechBase Services | خدمات الإعلام الآلي</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============================================================
       ROOT DESIGN SYSTEM
    ============================================================ */
    :root {
      --primary:    #6C63FF;
      --primary-d:  #4F46E5;
      --accent:     #00D4FF;
      --accent2:    #FF6584;
      --bg:         #0A0B1A;
      --bg2:        #0F1030;
      --bg3:        #141535;
      --glass:      rgba(255,255,255,0.04);
      --glass-b:    rgba(255,255,255,0.08);
      --text:       #E8E8F0;
      --text-dim:   #9090B0;
      --white:      #FFFFFF;
      --radius-lg:  20px;
      --radius-xl:  32px;
      --shadow:     0 24px 64px rgba(108,99,255,0.15);
      --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', 'Poppins', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.ltr {
      font-family: 'Poppins', 'Cairo', sans-serif;
    }

    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    /* ============================================================
       BACKGROUND ANIMATED GRADIENT
    ============================================================ */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      width: 900px; height: 900px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      top: -300px; left: -200px;
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(0,212,255,0.10) 0%, transparent 70%);
      bottom: -200px; right: -100px;
      animation: drift2 14s ease-in-out infinite alternate;
    }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(120px,80px) scale(1.2); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-80px,-60px) scale(1.15); } }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
    section { padding: 100px 0; }

    /* ============================================================
       NAVBAR
    ============================================================ */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 18px 0;
      transition: var(--transition);
    }
    #navbar.scrolled {
      background: rgba(10,11,26,0.90);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-b);
      padding: 12px 0;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 12px;
    }
    .nav-logo .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff;
      box-shadow: 0 4px 20px rgba(108,99,255,0.5);
    }
    .nav-logo span {
      font-weight: 900; font-size: 1.3rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-links {
      display: flex; align-items: center; gap: 8px;
    }
    .nav-links a {
      padding: 8px 18px; border-radius: 50px;
      font-size: 0.9rem; font-weight: 600;
      color: var(--text-dim);
      transition: var(--transition);
      position: relative;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--white);
      background: var(--glass-b);
    }

    /* Language Switcher */
    .lang-switcher {
      display: flex; align-items: center; gap: 6px;
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: 50px; padding: 5px 8px;
    }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      padding: 5px 12px; border-radius: 50px;
      font-size: 0.8rem; font-weight: 700;
      color: var(--text-dim);
      transition: var(--transition);
    }
    .lang-btn.active, .lang-btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }

    /* Hamburger */
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 6px; background: none; border: none;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: var(--transition);
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile Menu */
    .mobile-menu {
      display: none; position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,11,26,0.98);
      backdrop-filter: blur(24px);
      z-index: 999;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 1.4rem; font-weight: 700;
      color: var(--text-dim); transition: var(--transition);
    }
    .mobile-menu a:hover { color: var(--primary); }
    .mobile-close {
      position: absolute; top: 24px; right: 24px;
      background: none; border: none; cursor: pointer;
      font-size: 1.6rem; color: var(--text);
    }

    /* ============================================================
       HERO SECTION
    ============================================================ */
    #home {
      min-height: 100vh;
      display: flex; align-items: center;
      padding-top: 100px;
      position: relative;
    }
    .hero-content {
      max-width: 700px;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 50px; padding: 8px 20px;
      font-size: 0.85rem; font-weight: 600;
      color: var(--accent); margin-bottom: 28px;
      animation: fadeSlideDown 0.6s ease forwards;
    }
    .hero-badge i { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    .hero-title {
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900; line-height: 1.2;
      margin-bottom: 24px;
      animation: fadeSlideDown 0.6s 0.1s ease forwards; opacity: 0;
    }
    .hero-title .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 1.1rem; color: var(--text-dim); max-width: 560px;
      margin-bottom: 40px; line-height: 1.8;
      animation: fadeSlideDown 0.6s 0.2s ease forwards; opacity: 0;
    }

    .hero-actions {
      display: flex; gap: 16px; flex-wrap: wrap;
      animation: fadeSlideDown 0.6s 0.3s ease forwards; opacity: 0;
    }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      color: #fff; border: none; cursor: pointer;
      padding: 16px 36px; border-radius: 50px;
      font-size: 1rem; font-weight: 700;
      box-shadow: 0 8px 32px rgba(108,99,255,0.4);
      transition: var(--transition);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(108,99,255,0.5);
    }

    .btn-outline {
      display: inline-flex; align-items: center; gap: 10px;
      background: transparent;
      border: 2px solid var(--glass-b);
      color: var(--text); cursor: pointer;
      padding: 14px 34px; border-radius: 50px;
      font-size: 1rem; font-weight: 600;
      transition: var(--transition);
    }
    .btn-outline:hover {
      border-color: var(--primary); color: var(--primary);
      transform: translateY(-3px);
    }

    /* Hero Stats */
    .hero-stats {
      display: flex; gap: 40px; margin-top: 60px; flex-wrap: wrap;
      animation: fadeSlideDown 0.6s 0.4s ease forwards; opacity: 0;
    }
    .stat-item { text-align: start; }
    .stat-num {
      font-size: 2rem; font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-label { font-size: 0.85rem; color: var(--text-dim); }

    /* Hero Visual */
    .hero-visual {
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 45%;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
      animation: floatVisual 6s ease-in-out infinite;
    }
    [dir="ltr"] .hero-visual { right: 0; left: auto; }

    @keyframes floatVisual {
      0%,100% { transform: translateY(-50%) translateY(0); }
      50% { transform: translateY(-50%) translateY(-20px); }
    }

    .hero-visual-inner {
      width: 380px; height: 380px;
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(0,212,255,0.10));
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .hero-visual-inner::before {
      content: '';
      position: absolute; inset: -20px;
      border-radius: 50%;
      border: 1px dashed rgba(108,99,255,0.2);
      animation: spin 20s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .hero-visual-icon {
      font-size: 6rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Floating badges on hero */
    .float-badge {
      position: absolute;
      background: var(--bg3); border: 1px solid var(--glass-b);
      border-radius: 16px; padding: 12px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.8rem; font-weight: 600;
      box-shadow: var(--shadow);
      animation: floatBadge 4s ease-in-out infinite;
    }
    .float-badge .fbi { font-size: 1.2rem; }
    .float-badge:nth-child(1) { top: 60px; right: 20px; animation-delay: 0s; }
    .float-badge:nth-child(2) { bottom: 80px; left: 20px; animation-delay: 1.5s; }
    .float-badge:nth-child(3) { top: 160px; left: -20px; animation-delay: 0.8s; }
    @keyframes floatBadge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* ============================================================
       SECTION HEADER
    ============================================================ */
    .section-header { text-align: center; margin-bottom: 64px; }
    .section-tag {
      display: inline-block;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 50px; padding: 6px 18px;
      font-size: 0.8rem; font-weight: 700;
      color: var(--accent); margin-bottom: 16px;
      text-transform: uppercase; letter-spacing: 2px;
    }
    .section-title {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 900; line-height: 1.25; margin-bottom: 16px;
    }
    .section-title .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .section-desc { color: var(--text-dim); max-width: 560px; margin: 0 auto; font-size: 1rem; }

    /* Divider */
    .section-divider {
      width: 60px; height: 4px; margin: 20px auto 0;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 2px;
    }

    /* ============================================================
       ABOUT SECTION
    ============================================================ */
    #about { background: var(--bg2); }
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;
    }
    .about-visual {
      position: relative; display: flex; justify-content: center;
    }
    .about-card-main {
      background: linear-gradient(135deg, rgba(108,99,255,0.1), rgba(0,212,255,0.05));
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: var(--radius-xl);
      padding: 48px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .about-card-main::before {
      content: '';
      position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(transparent, rgba(108,99,255,0.05), transparent 30%);
      animation: rotateBg 8s linear infinite;
    }
    @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .about-icon-big {
      font-size: 5rem; margin-bottom: 24px; display: block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      position: relative; z-index: 2;
    }
    .about-card-main h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; position: relative; z-index: 2; }
    .about-card-main p { color: var(--text-dim); position: relative; z-index: 2; font-size: 0.95rem; }

    /* Small cards */
    .about-smalls {
      position: absolute;
      bottom: -20px;
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .about-small-card {
      background: var(--bg3);
      border: 1px solid var(--glass-b);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .about-small-card i { color: var(--accent); font-size: 1rem; }

    .about-content h2 {
      font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 900; margin-bottom: 20px; line-height: 1.3;
    }
    .about-content p { color: var(--text-dim); margin-bottom: 20px; line-height: 1.9; }
    .about-features { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    .about-feat {
      display: flex; align-items: flex-start; gap: 14px;
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: 14px; padding: 16px 20px;
      transition: var(--transition);
    }
    .about-feat:hover { border-color: var(--primary); transform: translateX(-4px); }
    [dir="ltr"] .about-feat:hover { transform: translateX(4px); }
    .about-feat-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #fff;
    }
    .about-feat-text h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .about-feat-text p { font-size: 0.85rem; color: var(--text-dim); margin: 0; }

    /* ============================================================
       SERVICES SECTION
    ============================================================ */
    #services { background: var(--bg); }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }
    .service-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-lg);
      padding: 36px 28px;
      transition: var(--transition);
      position: relative; overflow: hidden;
      cursor: default;
    }
    .service-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.4s ease;
    }
    .service-card:hover::before { transform: scaleX(1); }
    .service-card:hover {
      transform: translateY(-8px);
      border-color: rgba(108,99,255,0.3);
      box-shadow: 0 24px 64px rgba(108,99,255,0.15);
    }
    .service-icon {
      width: 64px; height: 64px; border-radius: 18px; margin-bottom: 24px;
      background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(0,212,255,0.1));
      border: 1px solid rgba(108,99,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      transition: var(--transition);
    }
    .service-icon i {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .service-card:hover .service-icon {
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      border-color: transparent;
    }
    .service-card:hover .service-icon i {
      background: linear-gradient(135deg, #fff, #eee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .service-card h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; }
    .service-card p { font-size: 0.9rem; color: var(--text-dim); line-height: 1.8; }
    .service-link {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 20px;
      font-size: 0.88rem; font-weight: 700;
      color: var(--primary); transition: var(--transition);
    }
    .service-link:hover { gap: 14px; }

    /* ============================================================
       PROCESS / HOW WE WORK
    ============================================================ */
    #process { background: var(--bg2); }
    .process-steps {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px; position: relative;
    }
    .process-steps::before {
      content: '';
      position: absolute; top: 48px; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
      opacity: 0.3;
    }
    .step-card {
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: var(--radius-lg); padding: 36px 24px; text-align: center;
      transition: var(--transition);
    }
    .step-card:hover {
      border-color: rgba(108,99,255,0.4);
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }
    .step-num {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; font-size: 1.3rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(108,99,255,0.4);
    }
    .step-card h3 { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }
    .step-card p { font-size: 0.85rem; color: var(--text-dim); }

    /* ============================================================
       CONTACT SECTION
    ============================================================ */
    #contact { background: var(--bg); }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: start;
    }
    .contact-info h2 {
      font-size: clamp(1.5rem, 2.5vw, 2rem); font-weight: 900; margin-bottom: 16px;
    }
    .contact-info p { color: var(--text-dim); margin-bottom: 36px; line-height: 1.9; }
    .contact-items { display: flex; flex-direction: column; gap: 20px; }
    .contact-item {
      display: flex; align-items: center; gap: 16px;
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: 16px; padding: 18px 22px;
      transition: var(--transition);
    }
    .contact-item:hover { border-color: var(--primary); }
    .ci-icon {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1rem;
    }
    .ci-text strong { display: block; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .ci-text span { font-size: 0.95rem; font-weight: 600; }

    /* Contact Form */
    .contact-form {
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: var(--radius-xl); padding: 44px;
    }
    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 700;
      margin-bottom: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--glass-b);
      border-radius: 14px; padding: 14px 18px;
      color: var(--text); font-size: 0.95rem;
      font-family: inherit; transition: var(--transition);
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
      background: rgba(108,99,255,0.05);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.1);
    }
    .form-group input::placeholder, .form-group textarea::placeholder {
      color: var(--text-dim);
    }
    .form-group textarea { height: 130px; resize: vertical; }
    .form-group select option { background: var(--bg3); color: var(--text); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .btn-submit {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      border: none; border-radius: 14px; cursor: pointer;
      color: #fff; font-size: 1rem; font-weight: 700;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(108,99,255,0.4);
      transition: var(--transition);
    }
    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(108,99,255,0.5);
    }

    /* Success Toast */
    .toast {
      position: fixed; bottom: 30px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff; padding: 16px 28px; border-radius: 14px;
      font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 8px 32px rgba(34,197,94,0.4);
      transform: translateY(100px); opacity: 0;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
      z-index: 9999; display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    [dir="rtl"] .toast { right: 30px; }
    [dir="ltr"] .toast { left: 30px; }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      background: var(--bg2);
      border-top: 1px solid var(--glass-b);
      padding: 60px 0 30px;
    }
    .footer-grid {
      display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 48px;
      margin-bottom: 48px;
    }
    .footer-brand p { color: var(--text-dim); font-size: 0.9rem; margin-top: 16px; line-height: 1.8; }
    .footer-col h4 {
      font-size: 0.85rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 20px; color: var(--text-dim);
    }
    .footer-col ul { display: flex; flex-direction: column; gap: 12px; }
    .footer-col ul a { font-size: 0.9rem; color: var(--text-dim); transition: var(--transition); }
    .footer-col ul a:hover { color: var(--primary); }
    .social-links { display: flex; gap: 12px; margin-top: 20px; }
    .social-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--glass); border: 1px solid var(--glass-b);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 0.95rem;
      transition: var(--transition);
    }
    .social-btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-color: transparent; color: #fff;
      transform: translateY(-3px);
    }
    .footer-bottom {
      border-top: 1px solid var(--glass-b);
      padding-top: 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .footer-bottom p { font-size: 0.85rem; color: var(--text-dim); }
    .footer-bottom span { color: var(--primary); }

    /* ============================================================
       ANIMATIONS
    ============================================================ */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0; transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    .reveal-delay-5 { transition-delay: 0.5s; }

    /* ============================================================
       SCROLL TO TOP
    ============================================================ */
    .scroll-top {
      position: fixed; bottom: 30px;
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none; cursor: pointer; color: #fff; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(108,99,255,0.4);
      opacity: 0; pointer-events: none; transform: translateY(20px);
      transition: var(--transition); z-index: 999;
    }
    .scroll-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .scroll-top:hover { transform: translateY(-4px); }
    [dir="rtl"] .scroll-top { left: 30px; }
    [dir="ltr"] .scroll-top { right: 30px; }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 1024px) {
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-visual { order: -1; }
      .contact-grid { grid-template-columns: 1fr; gap: 40px; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 36px; }
      .hero-visual { display: none; }
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      section { padding: 70px 0; }
      .hero-stats { gap: 24px; }
      .process-steps::before { display: none; }
      .footer-grid { grid-template-columns: 1fr; gap: 28px; }
      .form-row { grid-template-columns: 1fr; }
    }

</head>

  // ============================================================
  // LANGUAGE SYSTEM
  // ============================================================
  let currentLang = 'ar';

  function setLang(lang) {
    currentLang = lang;
    const t = translations[lang];
    const isRTL = lang === 'ar';

    // Set direction & lang attr
    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
    document.body.classList.toggle('ltr', !isRTL);

    // Update all data-key elements
    document.querySelectorAll('[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Update placeholders
    document.querySelectorAll('[data-key-placeholder]').forEach(el => {
      const key = el.getAttribute('data-key-placeholder');
      if (t[key] !== undefined) el.placeholder = t[key];
    });

    // Update select options
    document.querySelectorAll('select option[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Service arrows direction
    document.querySelectorAll('.svc-arrow').forEach(icon => {
      icon.className = isRTL
        ? 'fas fa-arrow-left svc-arrow'
        : 'fas fa-arrow-right svc-arrow';
    });

    // Active lang button
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    // Update document title & meta description
    document.title = lang === 'ar'
      ? 'TechBase | خدمات الإعلام الآلي'
      : lang === 'fr'
      ? 'TechBase | Services Informatiques'
      : 'TechBase | IT Services';

    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.content = t.hero_desc || '';
  }

  // ============================================================
  // NAVBAR SCROLL
  // ============================================================
  const navbar = document.getElementById('navbar');
  const scrollTop = document.getElementById('scrollTop');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 60) {
      navbar.classList.add('scrolled');
      scrollTop.classList.add('show');
    } else {
      navbar.classList.remove('scrolled');
      scrollTop.classList.remove('show');
    }

    // Active nav link
    const sections = ['home','about','services','process','contact'];
    let current = '';
    sections.forEach(id => {
      const sec = document.getElementById(id);
      if (sec && window.scrollY >= sec.offsetTop - 100) current = id;
    });
    document.querySelectorAll('.nav-link').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  });

  // ============================================================
  // MOBILE MENU
  // ============================================================
  function toggleMenu() {
    const menu = document.getElementById('mobileMenu');
    const ham = document.getElementById('hamburger');
    menu.classList.toggle('open');
    ham.classList.toggle('open');
    document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
  }

  // ============================================================
  // SCROLL REVEAL
  // ============================================================
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

  // ============================================================
  // CONTACT FORM
  // ============================================================
  function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const t = translations[currentLang];

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-paper-plane"></i> <span>${t.form_submit}</span>`;
      document.getElementById('contactForm').reset();
      showToast(t.toast_success);
    }, 1500);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    toastMsg.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4500);
  }

  // ============================================================
  // COUNTER ANIMATION
  // ============================================================
  function animateCounters() {
    document.querySelectorAll('.stat-num').forEach(el => {
      const target = parseInt(el.textContent.replace(/[^0-9]/g, ''));
      const suffix = el.textContent.replace(/[0-9]/g, '');
      let count = 0;
      const step = Math.ceil(target / 50);
      const timer = setInterval(() => {
        count = Math.min(count + step, target);
        el.textContent = suffix.includes('%') ? count + '%' : '+' + count;
        if (count >= target) clearInterval(timer);
      }, 30);
    });
  }

  const statsObs = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) { animateCounters(); statsObs.disconnect(); }
  }, { threshold: 0.5 });

  const statsEl = document.querySelector('.hero-stats');
  if (statsEl) statsObs.observe(statsEl);

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    setLang('ar');
  });
</script>
